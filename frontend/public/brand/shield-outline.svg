<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>AntTipid — Adaptive Duotone Outline Favicon</title>
  <style>
    :root {
      --stroke: #163300;
      --fill: #FFFFFF;
      --accent: #9FE870;
      --pupil: #163300;
      --glint: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --stroke: #9FE870;
        --fill: #163300;
        --accent: #9FE870;
        --pupil: #163300;
        --glint: #FFFFFF;
      }
    }
  </style>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Antennae -->
    <path d="M 110 92 C 100 48 78 26 36 16" fill="none" stroke="var(--stroke, #163300)" stroke-width="16" />
    <circle cx="34" cy="14" r="13" fill="var(--accent, #9FE870)" stroke="var(--stroke, #163300)" stroke-width="5" />

    <path d="M 146 92 C 156 48 178 26 220 16" fill="none" stroke="var(--stroke, #163300)" stroke-width="16" />
    <circle cx="222" cy="14" r="13" fill="var(--accent, #9FE870)" stroke="var(--stroke, #163300)" stroke-width="5" />

    <!-- Head Shield Contour with dynamic fill -->
    <path d="M 128 84
             C 184 84 204 124 194 168
             C 184 210 140 238 128 246
             C 116 238 72 210 62 168
             C 52 124 72 84 128 84 Z" 
          fill="var(--fill, #FFFFFF)" stroke="var(--stroke, #163300)" stroke-width="16" />

    <!-- Forehead Diamond -->
    <polygon points="128,104 142,122 128,140 114,122" fill="var(--accent, #9FE870)" stroke="var(--stroke, #163300)" stroke-width="4" />

    <!-- Almond Eyes -->
    <ellipse cx="100" cy="148" rx="16" ry="24" transform="rotate(-14 100 148)" fill="var(--accent, #9FE870)" stroke="var(--stroke, #163300)" stroke-width="5" />
    <circle cx="103" cy="146" r="6" fill="var(--pupil, #163300)" />
    <circle cx="106" cy="143" r="2.5" fill="var(--glint, #FFFFFF)" />

    <ellipse cx="156" cy="148" rx="16" ry="24" transform="rotate(14 156 148)" fill="var(--accent, #9FE870)" stroke="var(--stroke, #163300)" stroke-width="5" />
    <circle cx="153" cy="146" r="6" fill="var(--pupil, #163300)" />
    <circle cx="150" cy="143" r="2.5" fill="var(--glint, #FFFFFF)" />

    <!-- Mandibles -->
    <path d="M 112 216 L 100 238" fill="none" stroke="var(--stroke, #163300)" stroke-width="9" />
    <path d="M 144 216 L 156 238" fill="none" stroke="var(--stroke, #163300)" stroke-width="9" />
  </g>
</svg>