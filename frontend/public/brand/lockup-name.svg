<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 14 438 132" width="438" height="132">
  <title>AntTipid — Shield Lockup (Horizontal, no tagline)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Left Mark: Shield scaled to 128x128 inside (20, 16) -->
  <g transform="translate(20, 16) scale(0.5)">
    <g fill="#163300" stroke="#163300">
      <!-- Antennae -->
      <path d="M 110 106 C 102 54 82 32 40 22" fill="none" stroke-width="11" stroke-linecap="round" />
      <circle cx="38" cy="21" r="8.5" fill="#9FE870" stroke="#163300" stroke-width="3.5" />
      <path d="M 146 106 C 154 54 174 32 216 22" fill="none" stroke-width="11" stroke-linecap="round" />
      <circle cx="218" cy="21" r="8.5" fill="#9FE870" stroke="#163300" stroke-width="3.5" />

      <!-- Head Shield -->
      <path d="M 128 86 C 182 86 202 124 192 168 C 182 208 140 236 128 244 C 116 236 74 208 64 168 C 54 124 74 86 128 86 Z" fill="#163300" stroke="none" />
      <path d="M 88 114 C 108 102 148 102 168 114" fill="none" stroke="#2A4D12" stroke-width="3" stroke-linecap="round" opacity="0.6" />

      <!-- Diamond -->
      <polygon points="128,106 140,122 128,138 116,122" fill="#9FE870" stroke="none" />
      <polygon points="128,111 135,122 128,133 121,122" fill="#163300" stroke="none" />
      <circle cx="128" cy="122" r="2.2" fill="#F0F3EE" stroke="none" />

      <!-- Eyes -->
      <ellipse cx="102" cy="146" rx="14" ry="21" transform="rotate(-14 102 146)" fill="#9FE870" stroke="none" />
      <circle cx="104" cy="144" r="5.2" fill="#163300" stroke="none" />
      <circle cx="106" cy="141.5" r="2" fill="#F0F3EE" stroke="none" />

      <ellipse cx="154" cy="146" rx="14" ry="21" transform="rotate(14 154 146)" fill="#9FE870" stroke="none" />
      <circle cx="152" cy="144" r="5.2" fill="#163300" stroke="none" />
      <circle cx="150" cy="141.5" r="2" fill="#F0F3EE" stroke="none" />

      <!-- Mandibles -->
      <path d="M 114 212 L 104 230 L 116 226" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 142 212 L 152 230 L 140 226" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography Lockup -->
  <!-- Brand Name -->
  <text x="175" y="92" class="brand-title">
    <tspan fill="#163300">Ant</tspan><tspan fill="#3F8A24">Tipid</tspan>
  </text>

</svg>
