<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>The Carrier — Philippine Peso Logo Edition (Bold ₱)</title>

  <!-- ==================== COIN WITH PHILIPPINE PESO LOGO (₱) ==================== -->
  <g id="carried-coin">
    <!-- Coin Disc (Electric Lime) -->
    <circle cx="116" cy="80" r="48" fill="#9FE870" stroke="#163300" stroke-width="8.5" />
    <!-- Milled Edge / Serration Ring -->
    <circle cx="116" cy="80" r="40" fill="none" stroke="#163300" stroke-width="2.5" stroke-dasharray="3 3.5" opacity="0.6" />
    <!-- Inner Ridge Ring -->
    <circle cx="116" cy="80" r="34" fill="none" stroke="#2A4D12" stroke-width="1.5" />

    <!-- Sculpted Philippine Peso Sign (₱) Centered at (116, 80) -->
    <g id="philippine-peso-symbol">
      <!-- Main Stem and Loop of 'P' -->
      <path d="M 104 60 
               H 124 
               C 136 60 144 66 144 76 
               C 144 86 136 92 124 92 
               H 104 
               V 104" 
            fill="none" 
            stroke="#163300" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Top Horizontal Crossbar of ₱ -->
      <line x1="96" y1="71" x2="138" y2="71" 
            stroke="#163300" 
            stroke-width="6.5" 
            stroke-linecap="round" />

      <!-- Bottom Horizontal Crossbar of ₱ -->
      <line x1="96" y1="81" x2="138" y2="81" 
            stroke="#163300" 
            stroke-width="6.5" 
            stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== ANT (FOREST GREEN) ==================== -->
  <g fill="#163300" stroke="#163300">
    <!-- Abdomen -->
    <path d="M 94 158 C 96 172 82 192 56 195 C 30 198 18 178 24 160 C 30 142 54 134 80 140 C 90 142 93 150 94 158 Z" stroke="none" />
    <!-- Abdomen stripe accents -->
    <path d="M 44 146 C 40 162 42 178 52 188" fill="none" stroke="#9FE870" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 62 143 C 60 160 64 174 74 182" fill="none" stroke="#9FE870" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- Waist -->
    <ellipse cx="102" cy="158" rx="7" ry="5" stroke="none" />

    <!-- Thorax -->
    <ellipse cx="130" cy="152" rx="23" ry="18" stroke="none" />

    <!-- Supporting Arm lifting the coin -->
    <path d="M 134 140 L 144 114 L 138 88" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="138" cy="88" r="4.5" stroke="none" />

    <!-- Head -->
    <ellipse cx="178" cy="126" rx="20" ry="23" transform="rotate(22 178 126)" stroke="none" />
    <!-- Expressive Eye with glint -->
    <ellipse cx="186" cy="118" rx="6" ry="8" transform="rotate(15 186 118)" fill="#9FE870" stroke="none" />
    <circle cx="187" cy="117" r="3.2" fill="#163300" stroke="none" />
    <circle cx="188" cy="115.5" r="1.3" fill="#F0F3EE" stroke="none" />
    <!-- Mandible -->
    <path d="M 194 135 L 204 141 L 198 144" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Antennae -->
    <path d="M 186 105 C 195 78 212 56 235 46" fill="none" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="236" cy="45" r="4.5" fill="#9FE870" stroke="#163300" stroke-width="2.5" />

    <path d="M 177 106 C 184 84 196 68 216 58" fill="none" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="217" cy="57" r="4" fill="#9FE870" stroke="#163300" stroke-width="2" />

    <!-- Stance Walking Legs -->
    <path d="M 148 162 L 170 190 L 194 220" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 128 164 L 122 192 L 134 222" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 108 164 L 84 192 L 64 222" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
