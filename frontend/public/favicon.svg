<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>The Ant Shield — Electric Duotone Outline</title>
  
  <!-- Outer Linework in Forest Green -->
  <g fill="none" stroke="#163300" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antennae -->
    <path d="M 110 88 C 103 54 82 32 40 22" stroke-width="8.5" />
    <circle cx="38" cy="21" r="8.5" fill="#9FE870" stroke="#163300" stroke-width="3.5" />

    <path d="M 146 88 C 153 54 174 32 216 22" stroke-width="8.5" />
    <circle cx="218" cy="21" r="8.5" fill="#9FE870" stroke="#163300" stroke-width="3.5" />

    <!-- Head Shield Contour (Linear Open) -->
    <path d="M 128 86
             C 182 86 202 124 192 168
             C 182 208 140 236 128 244
             C 116 236 74 208 64 168
             C 54 124 74 86 128 86 Z" 
          stroke-width="8" stroke-linejoin="round" />

    <!-- Crown Brow Arc in Electric Lime -->
    <path d="M 92 115 C 110 106 146 106 164 115" stroke="#9FE870" stroke-width="3.5" />

    <!-- Diamond Forehead (Glowing Electric Lime) -->
    <polygon points="128,106 140,122 128,138 116,122" fill="#9FE870" stroke="#163300" stroke-width="2.5" />
    <polygon points="128,111 135,122 128,133 121,122" fill="#163300" stroke="none" />
    <circle cx="128" cy="122" r="2.2" fill="#F0F3EE" stroke="none" />

    <!-- Glowing Almond Lime Eyes -->
    <ellipse cx="102" cy="146" rx="14" ry="21" transform="rotate(-14 102 146)" fill="#9FE870" stroke="#163300" stroke-width="3.5" />
    <circle cx="104" cy="144" r="5.2" fill="#163300" stroke="none" />
    <circle cx="106" cy="141.5" r="2" fill="#F0F3EE" stroke="none" />

    <ellipse cx="154" cy="146" rx="14" ry="21" transform="rotate(14 154 146)" fill="#9FE870" stroke="#163300" stroke-width="3.5" />
    <circle cx="152" cy="144" r="5.2" fill="#163300" stroke="none" />
    <circle cx="150" cy="141.5" r="2" fill="#F0F3EE" stroke="none" />

    <!-- Mandible Jaws -->
    <path d="M 114 212 L 104 230 L 116 226" stroke-width="5" />
    <path d="M 142 212 L 152 230 L 140 226" stroke-width="5" />
  </g>
</svg>
