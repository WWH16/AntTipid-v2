<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-means anomaly flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · AntTipid · feature 9</p>
    <h1>How a purchase gets flagged as unusual</h1>

    <!-- Replace kmeans-anomaly-flow with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kmeans-anomaly-flow-title kmeans-anomaly-flow-desc">
        <title id="kmeans-anomaly-flow-title">How a purchase gets flagged as unusual</title>
        <desc id="kmeans-anomaly-flow-desc">Per-category K-means check: categories with too little data use a simple rule (over 3x the next highest); otherwise k is chosen by silhouette, K-means is fitted, and purchases well above their nearest habit (modified z over 3.5 and at least 1.5x) are flagged as unusual.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <line x1="320" y1="92" x2="320" y2="122" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="392" y1="164" x2="558" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="460" y="144" width="22" height="12" rx="2" fill="#f5f5f5"/>
        <text x="471.0" y="153" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <line x1="320" y1="204" x2="320" y2="242" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="330" y="218" width="27" height="12" rx="2" fill="#f5f5f5"/>
        <text x="343.5" y="227" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <line x1="320" y1="296" x2="320" y2="326" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="320" y1="384" x2="320" y2="414" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="320" y1="468" x2="320" y2="502" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="416" y1="552" x2="558" y2="552" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="468" y="532" width="27" height="12" rx="2" fill="#f5f5f5"/>
        <text x="481.5" y="541" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <line x1="320" y1="600" x2="320" y2="638" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="330" y="612" width="22" height="12" rx="2" fill="#f5f5f5"/>
        <text x="341.0" y="621" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <line x1="680" y1="188" x2="680" y2="526" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="690" y="350" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="721.0" y="359" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLEAR JUMP</text>
        <path d="M 120,90 Q 160,100 198,74" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="198" cy="74" r="2" fill="#2d3142"/>
        <text x="40" y="62" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">spending habits only,</text>
        <text x="40" y="80" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">not budgets</text>
        <path d="M 120,394 Q 160,396 178,364" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="178" cy="364" r="2" fill="#bf4520"/>
        <text x="40" y="344" fill="#bf4520" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">k isn't fixed,</text>
        <text x="40" y="362" fill="#bf4520" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">picked per user</text>
        <text x="40" y="380" fill="#bf4520" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">and per category</text>
        <rect x="200" y="40" width="240" height="52" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="40" width="240" height="52" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320.0" y="64.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">One category's expenses</text>
        <text x="320.0" y="80.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one user · last 6 months</text>
        <polygon points="320,124 396,164 320,204 244,164" fill="#f5f5f5"/>
        <polygon points="320,124 396,164 320,204 244,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="168" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">10+ expenses?</text>
        <rect x="560" y="140" width="240" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="140" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680.0" y="162.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Simple rule</text>
        <text x="680.0" y="178.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">over 3× the next highest</text>
        <rect x="200" y="244" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="244" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320.0" y="268.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Log of each amount</text>
        <text x="320.0" y="284.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log(₱), standardized</text>
        <rect x="180" y="328" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="328" width="280" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="320.0" y="354.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Pick k by silhouette</text>
        <text x="320.0" y="370.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">try k = 2–4 · best < 0.75 → k = 1</text>
        <rect x="200" y="416" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="416" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320.0" y="440.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Fit K-means</text>
        <text x="320.0" y="456.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k-means++ · 5 restarts · habits</text>
        <polygon points="320,504 420,552 320,600 220,552" fill="#f5f5f5"/>
        <polygon points="320,504 420,552 320,600 220,552" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="548" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Well above</text>
        <text x="320" y="564" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">its habit?</text>
        <rect x="560" y="528" width="240" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="560" y="528" width="240" height="48" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="680.0" y="550.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Unusual</text>
        <text x="680.0" y="566.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reason shown · counted once</text>
        <rect x="200" y="640" width="240" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="640" width="240" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320.0" y="662.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Normal</text>
        <text x="320.0" y="678.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">part of your habits</text>
        <line x1="40" y1="724" x2="920" y2="724" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="740" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="751" width="20" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="66" y="760" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Start / result</text>
        <rect x="160" y="751" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="186" y="760" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Step</text>
        <polygon points="230,750 240,757 230,764 220,757" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="248" y="760" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Decision</text>
        <rect x="316" y="751" width="20" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="342" y="760" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Where the answer to "how many k" and "is it unusual" comes from</text>
        <text x="920" y="760" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="end">Runs per user, per category, each time the check runs</text>

      </svg>
    </div>
  </div>
</body>
</html>
